engine = On

extension_dir = "extensions"
;extension=extension.so

; Date
date.timezone=Europe/Berlin

; Errors
; 注意：本 PHP 被当作「输出 m3u8 正文的 CGI」使用，PhpServer 靠正文首字符 (#EXTM3U)
; 判定 Content-Type。display_errors=On 时 PHP 的 warning/notice 文字会混进正文最前面，
; 导致 startsWith("#EXTM3U") 判定失败 → Content-Type 变 text/html → 直播解析失败。
; 故 display_errors / display_startup_errors 必须为 Off；错误改由 error_log 记录。
error_reporting=E_ALL
display_errors=Off
display_startup_errors=Off
log_errors=On
; 相对路径由 PhpEnv 启动时改写为内部存储 files/php/tmp/php_error.log
error_log = "tmp/php_error.log"
report_memleaks=On
report_zend_debug=Off

; General
short_open_tag=On
ignore_user_abort=Off
implicit_flush=Off
output_buffering = 4096
default_charset = "UTF-8"

; Execution time
; 单线程服务器下不能太长，否则远程源卡住时 worker 被阻塞导致所有请求堆积
max_execution_time=15

; Memory
memory_limit=128M

; File uploads
max_file_uploads=20
upload_max_filesize=512M
post_max_size=512M

; === File Handling ===
file_uploads = On
upload_tmp_dir = "tmp"
session.save_path = "tmp"
sys_temp_dir = "tmp"